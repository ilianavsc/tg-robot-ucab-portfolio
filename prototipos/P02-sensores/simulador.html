/* Inspector de hardware P02 · estilos de la interfaz. Las fuentes van aparte (fuentes.css) y se unen al construir. */
:root{--tinta:#14213D;--coral:#F2603D;--verde:#0F9D84;--ambar:#E8B90C;--violeta:#6B4EE6;--papel:#ffffff;--vidrio:rgba(20,33,61,.88);--sombra:0 4px 0 rgba(20,33,61,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe8e5;color:var(--tinta);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;overflow:hidden}
#lienzo{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#guias{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
#guias line{stroke-width:1.6;stroke-linecap:round;opacity:.75}
#etiquetas{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #FFD23F;outline-offset:2px}

/* etiquetas 3D */
.et{position:absolute;left:0;top:0;pointer-events:auto;border:0;border-left:4px solid var(--c);border-radius:8px;background:rgba(255,255,255,.94);color:var(--tinta);font-size:12.5px;line-height:1.2;font-weight:700;padding:5px 9px;max-width:230px;text-align:left;white-space:normal;box-shadow:0 2px 6px rgba(20,33,61,.28);will-change:transform}
.et.act{background:#FFD23F}
.et:hover{background:#fff7d1}

/* barra de controles */
.barra{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.barra>*{pointer-events:auto}
.btn{min-height:44px;min-width:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--tinta);background:var(--vidrio);color:#fff;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--sombra)}
.btn:hover{background:#1c2d52}
.btn[aria-pressed="true"]:not(.pri){background:var(--verde);border-color:var(--tinta)}
.btn.pri{background:#0b7a66;color:#fff}
.btn.pri:hover{background:#096655}
.btn.pri[aria-pressed="true"]{background:#dc2626;border-color:var(--tinta)}
.btn.pri[aria-pressed="true"]:hover{background:#b91c1c}
.est-dot{width:9px;height:9px;border-radius:50%;background:#fde047;border:1.5px solid rgba(20,33,61,.5);flex:none}
.btn.pri[aria-pressed="true"] .est-dot{background:#4ade80;box-shadow:0 0 8px #4ade80}
.grupo{display:inline-flex;border-radius:12px;box-shadow:var(--sombra)}
.grupo .btn{border-radius:0;box-shadow:none;margin-left:-2px}
.grupo .btn:first-child{border-radius:12px 0 0 12px;margin-left:0}
.grupo .btn:last-child{border-radius:0 12px 12px 0}
.grupo .btn[aria-pressed="true"]{background:var(--violeta)}

/* aviso de inspección: se va al abrir la primera ficha */
.pista-tocar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--alto-tira,64px) + 18px);margin:0;padding:8px 14px;border-radius:999px;background:#FFD23F;border:2px solid var(--tinta);font-weight:700;font-size:14px;box-shadow:var(--sombra);pointer-events:none;white-space:nowrap}
.pista-tocar[hidden]{display:none}

/* consola de sensores (opcional, botón "Consola de sensores"): mismo estilo oscuro que el radar de P03 */
.consola[hidden]{display:none}
.consola{position:absolute;left:10px;bottom:calc(var(--alto-tira,64px) + 18px);display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:14px;background:#0f172a;border:2px solid #334155;box-shadow:0 6px 16px rgba(2,6,23,.35);color:#e2e8f0;max-width:calc(100vw - 20px)}
.c-vinculo{font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f8fafc;padding:4px 8px;border-radius:8px;background:rgba(56,189,248,.14);border-left:4px solid var(--c-vinc,#38bdf8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-vinculo[hidden]{display:none}
.c-bloques{display:flex;gap:8px;align-items:stretch}
.c-velo{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:90px;padding:4px 6px;border-radius:10px;background:#0b1424;border:1.5px solid rgba(148,163,184,.26);transition:border-color .2s ease-out,box-shadow .2s ease-out}
.c-velo svg{width:82px;height:44px;display:block;overflow:visible}
.c-velo-pista{fill:none;stroke:#1e293b;stroke-width:6;stroke-linecap:round}
.c-velo-arco{fill:none;stroke:#22c55e;stroke-width:6;stroke-linecap:round;transition:stroke .2s ease-out}
.c-velo-aguja{stroke:#f8fafc;stroke-width:2.2;stroke-linecap:round}
.c-velo-pivote{fill:#f8fafc}
.c-velo-val{font:700 14.5px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:#22c55e;white-space:nowrap}
.c-velo-val small{font-size:10px;font-weight:600;color:#94a3b8;margin-left:3px}
.c-linea{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 8px;border-radius:10px;background:#0b1424;border:1.5px solid rgba(148,163,184,.26);transition:border-color .2s ease-out,box-shadow .2s ease-out}
.c-leds,.c-leds-et{display:grid;grid-template-columns:repeat(4,24px);gap:5px;justify-items:center}
.c-leds i{width:20px;height:20px;border-radius:50%;background:#1e293b;border:2px solid #334155;transition:background-color .12s ease-out,box-shadow .12s ease-out,border-color .12s ease-out}
.c-leds i.on{background:#facc15;border-color:#facc15;box-shadow:0 0 12px rgba(250,204,21,.85)}
.c-leds-et{font:700 10px/1 ui-monospace,monospace;color:#94a3b8}
.c-modo{font:700 10px/1 ui-monospace,monospace;letter-spacing:.06em;padding:4px 8px;border-radius:999px;background:rgba(34,197,94,.16);color:#86efac;border:1px solid rgba(34,197,94,.45);transition:box-shadow .2s ease-out}
.c-modo.apagado{background:rgba(148,163,184,.16);color:#cbd5e1;border-color:rgba(148,163,184,.4)}
.c-modo.manual{background:rgba(107,78,230,.25);color:#c4b5fd;border-color:rgba(167,139,250,.6)}
.c-modo.bloq{background:rgba(185,28,28,.9);color:#fff;border-color:#f87171}
.c-dist{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:96px;padding:5px 8px;border-radius:10px;background:#0b1424;border:1.5px solid rgba(148,163,184,.26);font:600 11px/1.2 ui-monospace,monospace;font-variant-numeric:tabular-nums;transition:border-color .2s ease-out,box-shadow .2s ease-out}
.c-dist-tit{font-size:9.5px;letter-spacing:.06em;color:#94a3b8;text-transform:uppercase}
.c-dist-fila{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.c-dist-fila b{color:#e2e8f0}
.c-dist-fila b[data-zona="critica"]{color:#f87171}
.c-dist-fila b[data-zona="precaucion"]{color:#fbbf24}
.c-dist-fila b[data-zona="libre"]{color:#4ade80}
.consola [data-bloque].vinculado{border-color:var(--c-vinc,#38bdf8)!important;box-shadow:0 0 0 2px var(--c-vinc,#38bdf8)}

/* D-Pad: la misma modalidad del Simulador 1 (P04); con la consola abierta se corre a su derecha */
.app.con-consola .dpad{left:calc(var(--ancho-consola,260px) + 22px)}
.dpad{position:absolute;left:10px;bottom:calc(var(--alto-tira,64px) + 18px);display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);grid-template-areas:". u ." "l s r" ". d .";gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.dp{border-radius:12px;border:2px solid var(--tinta);background:rgba(20,33,61,.82);color:#fff;font-weight:700;font-size:18px;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dp.on{background:var(--verde)}
.dp.stop{background:rgba(242,96,61,.92);font-size:15px}
.dp.stop.on{background:#c23a1b}

/* tira de componentes */
.tira{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:48px;padding:6px 10px;border-radius:12px;border:2px solid var(--tinta);border-left:6px solid var(--c);background:rgba(255,255,255,.95);color:var(--tinta);text-align:left;box-shadow:var(--sombra)}
.chip b{font-size:13px;line-height:1.15}
.chip .res{font-size:11px;line-height:1.2;color:#475569;max-width:170px}
.chip .v{font:600 12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:#33415f;display:flex;gap:3px;align-items:center;min-height:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:#FFD23F}
.chip .sq{width:14px;height:14px;border-radius:3px;border:2px solid var(--tinta);background:#fff}
.chip .sq.on{background:#0F9D84}
.chip .v[data-zona="critica"]{color:#c23a1b}
.chip .v[data-zona="precaucion"]{color:#8a6a00}
.chip .v[data-zona="libre"]{color:#0b7a66}

/* ficha */
.ficha{position:absolute;right:10px;top:104px;bottom:128px;width:min(336px,calc(100% - 20px));background:#fff;border:2px solid var(--tinta);border-top:8px solid var(--c);border-radius:14px;box-shadow:5px 5px 0 var(--tinta);display:flex;flex-direction:column;overflow:hidden}
.ficha[hidden]{display:none}
.ficha header{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:12px 14px 6px}
.ficha h2{font:700 19px/1.15 'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.ficha .cerrar{flex:none;width:44px;height:44px;border-radius:10px;border:2px solid var(--tinta);background:#fff;font-size:20px;line-height:1;font-weight:700}
.ficha .cuerpo{overflow:auto;padding:0 14px 14px;font-size:14px;line-height:1.4}
.ficha h3{font:700 11.5px/1.2 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#5a6785;margin:14px 0 6px}
.ficha .rol{margin:6px 0 0}
.ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.ficha dt{font-weight:700;color:#33415f}
.ficha dd{margin:0}
.ficha .vivo dd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.ficha .nota{margin:12px 0 0;padding:8px 10px;border-radius:8px;background:#f1f5f4;font-size:13px;color:#33415f}
.ficha-vinculo{margin:12px 0 0;padding:9px 11px;border-radius:10px;background:#0f172a;color:#e2e8f0;border-left:5px solid var(--c);display:grid;gap:4px}
.ficha-vinculo strong{font:700 12px/1.2 ui-monospace,monospace;color:#7dd3fc}
.ficha-vinculo p{margin:0;font-size:12.5px;line-height:1.35;color:#cbd5e1}
.btn-vinc{margin-top:4px;min-height:44px;padding:6px 10px;border-radius:8px;border:1.5px solid #38bdf8;background:rgba(56,189,248,.16);color:#f8fafc;font:700 12px/1.2 ui-monospace,monospace;text-align:center}
.btn-vinc:hover{background:rgba(56,189,248,.28)}
.chip-estado{display:inline-block;font:700 11.5px/1 ui-monospace,monospace;padding:4px 8px;border-radius:999px;border:2px solid var(--tinta);margin-top:2px}
.chip-estado.hecho{background:#c9f0e6}
.chip-estado.aviso{background:#ffe7a8}
.chip-estado.pendiente{background:#ffd5c9}

@media (max-width:640px){
  .barra{gap:6px}
  .btn{min-height:44px;padding:6px 10px;font-size:13.5px}
  .btn .largo{display:none}
  .pista-tocar{font-size:12.5px;padding:6px 11px;bottom:calc(var(--alto-tira,64px) + 176px)}
  .consola{padding:6px;max-width:calc(100vw - 164px)}
  .c-bloques{flex-direction:column;gap:6px}
  .c-velo,.c-dist{min-width:0}
  .c-leds,.c-leds-et{grid-template-columns:repeat(4,22px);gap:4px}
  .c-leds i{width:18px;height:18px}
  .app .dpad,.app.con-consola .dpad{left:auto;right:10px;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
  .tira{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .chip{flex:none}
  .chip .res{display:none}
  .ficha{top:auto;right:10px;left:10px;width:auto;bottom:74px;max-height:46%}
  .et{font-size:11px;padding:4px 7px;max-width:150px}
}
@media (max-width:640px) and (max-height:700px){.ficha{max-height:50%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}

</style>
</head>
<body data-modo="auto" data-encendido="0">
<div class="app" id="app">
  <canvas id="lienzo" tabindex="0" aria-label="Inspector 3D de los componentes del robot: toca una pieza para ver su ficha; se maneja con W A S D, las flechas o el D-Pad" role="img"></canvas>
  <svg id="guias" aria-hidden="true"></svg>
  <div id="etiquetas"></div>

  <div class="barra" role="toolbar" aria-label="Controles">
    <button class="btn" id="b-xray" type="button" aria-pressed="false"><span aria-hidden="true">🩻</span><span class="largo"> Rayos X</span></button>
    <button class="btn" id="b-etiq" type="button" aria-pressed="true" aria-label="Etiquetas"><span aria-hidden="true">🏷️</span><span class="largo"> Etiquetas</span></button>
    <button class="btn" id="b-vista" type="button" aria-label="Cambiar la vista de la cámara"><span aria-hidden="true">🎥</span> <span id="b-vista-tx">Inspección</span></button>
    <div class="grupo" role="group" aria-label="Modo de manejo">
      <button class="btn" type="button" data-modo="auto" aria-pressed="true"><span aria-hidden="true">🤖</span> Auto</button>
      <button class="btn" type="button" data-modo="manual" aria-pressed="false"><span aria-hidden="true">🎮</span> Manual</button>
    </div>
    <button class="btn pri en-pausa" id="b-pausa" type="button" aria-pressed="false" aria-label="Encender o detener el robot"><span class="est-dot" aria-hidden="true"></span><span class="tx">⚡ Encender</span></button>
    <button class="btn" id="b-consola" type="button" aria-pressed="false" aria-controls="consola"><span aria-hidden="true">📟</span> Consola de sensores</button>
  </div>
  <p class="pista-tocar" id="pista-tocar" role="note"><span aria-hidden="true">🔍</span> Toca una pieza para ver su ficha</p>

  <section class="consola" id="consola" aria-label="Consola de sensores en vivo" hidden>
    <div class="c-vinculo" id="consola-vinculo" aria-live="polite" hidden></div>
    <div class="c-bloques">
      <div class="c-velo" id="velocimetro" data-bloque="velo" role="img" aria-label="Velocímetro">
        <svg viewBox="0 0 80 46" aria-hidden="true">
          <path class="c-velo-pista" d="M 10 40 A 30 30 0 0 1 70 40"/>
          <path id="velo-arco" class="c-velo-arco" d="M 10 40 A 30 30 0 0 1 70 40" stroke-dasharray="94.25" stroke-dashoffset="94.25"/>
          <line id="velo-aguja" class="c-velo-aguja" x1="40" y1="40" x2="40" y2="15" transform="rotate(-90 40 40)"/>
          <circle class="c-velo-pivote" cx="40" cy="40" r="3"/>
        </svg>
        <b class="c-velo-val" id="velo-val">0,00<small>m/s</small></b>
      </div>
      <div class="c-linea" role="img" id="linea-leds" data-bloque="linea" aria-label="Sensores de línea">
        <div class="c-leds" aria-hidden="true"><i data-s="0"></i><i data-s="1"></i><i data-s="2"></i><i data-s="3"></i></div>
        <div class="c-leds-et" aria-hidden="true"><span>S1</span><span>S2</span><span>S3</span><span>S4</span></div>
        <span class="c-modo" id="c-modo" data-bloque="modo">APAGADO</span>
      </div>
      <div class="c-dist" id="c-dist" data-bloque="distancia" role="group" aria-label="Distancias HC-SR04P">
        <span class="c-dist-tit">HC-SR04P</span>
        <div class="c-dist-fila"><span>Frente</span><b id="c-dist-f">—</b></div>
        <div class="c-dist-fila"><span>Atrás</span><b id="c-dist-r">—</b></div>
      </div>
    </div>
  </section>

  <div class="dpad" id="dpad" role="group" aria-label="Manejo: avanzar, girar, frenar y retroceder">
    <button type="button" class="dp" data-dp="arriba" aria-label="Avanzar" style="grid-area:u">▲</button>
    <button type="button" class="dp" data-dp="izq" aria-label="Girar a la izquierda" style="grid-area:l">◄</button>
    <button type="button" class="dp stop" data-dp="stop" aria-label="Frenar" style="grid-area:s">■</button>
    <button type="button" class="dp" data-dp="der" aria-label="Girar a la derecha" style="grid-area:r">►</button>
    <button type="button" class="dp" data-dp="abajo" aria-label="Retroceder" style="grid-area:d">▼</button>
  </div>

  <aside class="ficha" id="ficha" role="dialog" aria-labelledby="f-titulo" hidden>
    <header><h2 id="f-titulo"></h2><button class="cerrar" id="f-cerrar" type="button" aria-label="Cerrar la ficha">×</button></header>
    <div class="cuerpo" id="f-cuerpo"></div>
  </aside>

  <nav class="tira" id="tira" aria-label="Componentes del robot (toca uno para ver su ficha)"></nav>
</div>
